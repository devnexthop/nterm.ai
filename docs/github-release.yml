name: Release NTerm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
      - name: Stage static UI
        run: |
          mkdir -p backend/app/static
          cp -R frontend/dist/. backend/app/static/
        shell: bash
      - name: Build engine
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt -r requirements-build.txt
          python -m PyInstaller --noconfirm nterm-engine.spec
        shell: bash
      - name: Stage engine
        run: |
          rm -rf desktop/engine
          mkdir -p desktop/engine
          cp -R backend/dist/nterm-engine/. desktop/engine/
        shell: bash
      - name: Electron installer
        working-directory: desktop
        run: |
          npm ci || npm install
          npm run ${{ matrix.script }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nterm-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
          body: |
            NTerm ${{ github.ref_name }} — https://nterm.ai
            Windows: run the Setup .exe
            macOS: open the .dmg and drag NTerm to Applications
